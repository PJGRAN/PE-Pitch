<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Architecture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: transparent; }

body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  color: #14100c;
}

:root {
  --accent: #3E6FA3;
  --accent-border: rgba(62,111,163,0.28);
  --card: rgba(252,248,244,0.88);
  --card-border: rgba(62,111,163,0.15);
  --card-shadow: 0 2px 20px rgba(62,111,163,0.13);
  --muted: rgba(20,16,12,0.52);
  --text: #14100c;
  --text2: #2a2016;
  --hi-bg: rgba(232,244,246,0.92);
}

/* TIMER BAR */
.timer-bar {
  height: 2px;
  background: rgba(62,111,163,0.12);
  flex-shrink: 0;
  overflow: hidden;
}
.timer-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width linear;
}

/* CANVAS */
.canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 32px 6px;
  overflow: hidden;
  min-height: 0;
  position: relative;
}

/* LAYER */
.layer {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  flex-shrink: 0;
}
.layer.hi {
  background: var(--hi-bg);
  border-color: var(--accent-border);
}
.layer-id {
  width: 42px;
  min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--accent);
  border-right: 1px solid var(--card-border);
  background: rgba(62,111,163,0.05);
  flex-shrink: 0;
}
.layer.hi .layer-id { background: rgba(62,111,163,0.1); border-right-color: var(--accent-border); }
.layer-content { flex: 1; padding: 8px 13px; display: flex; flex-direction: column; justify-content: center; }
.layer-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
.layer.hi .layer-name { color: var(--accent); }
.layer-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.shared-badge {
  padding-right: 11px;
  display: flex; align-items: center;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: rgba(62,111,163,0.4); flex-shrink: 0;
}

/* STACK */
.stack { display: flex; flex-direction: column; gap: 5px; }

/* --- PHASE 2 EXPAND ANIMATIONS --- */
@keyframes growDown {
  from { transform: scaleY(0); opacity: 0; transform-origin: top; }
  to   { transform: scaleY(1); opacity: 1; transform-origin: top; }
}
@keyframes growUp {
  from { transform: scaleY(0); opacity: 0; transform-origin: bottom; }
  to   { transform: scaleY(1); opacity: 1; transform-origin: bottom; }
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}
.grow-down { animation: growDown 0.42s cubic-bezier(.4,0,.2,1) both; }
.grow-up   { animation: growUp   0.42s cubic-bezier(.4,0,.2,1) both; }
.fade-up   { animation: fadeSlide 0.38s ease both; }

/* --- PHASE 3: MIGRATION LAYOUT --- */
.mig-wrap {
  display: flex;
  align-items: center;
  gap: 0;
  width: 100%;
  max-width: 820px;
}
.mig-stack-col { flex: 0 0 200px; display: flex; flex-direction: column; gap: 5px; }
.arrow-col {
  flex: 0 0 44px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
}
.arrow-line {
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--accent); font-weight: 700;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.arrow-line.show { opacity: 1; }
.mig-block-col { flex: 0 0 150px; }
.mig-block {
  background: rgba(62,111,163,0.08);
  border: 1px solid var(--accent-border);
  border-radius: 10px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--card-shadow);
  overflow: hidden;
}
.mig-block-header {
  padding: 8px 13px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--accent);
  border-bottom: 1px solid var(--accent-border);
  background: rgba(62,111,163,0.06);
  text-align: center;
}
.mig-block-row {
  padding: 6px 13px;
  font-size: 11px; color: var(--muted);
  border-bottom: 1px solid var(--card-border);
  line-height: 1.35;
}
.mig-block-row:last-child { border-bottom: none; }
.sources-col { flex: 0 0 150px; display: flex; flex-direction: column; gap: 6px; margin-left: 4px; }
.source-box {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 7px;
  padding: 7px 12px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-size: 12px; font-weight: 600;
  color: var(--text2); text-align: center;
  box-shadow: var(--card-shadow);
  opacity: 0;
  transform: translateX(8px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.source-box.show { opacity: 1; transform: none; }

/* --- PHASE 4/5: MULTI-INSTANCE --- */
.multi-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 820px;
}
.multi-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.14em; color: var(--accent); text-align: center;
}
.instances-row { display: flex; gap: 10px; width: 100%; }
.instance-card {
  flex: 1;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.instance-card.show { opacity: 1; transform: none; }
.instance-header {
  padding: 7px 12px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(62,111,163,0.06);
  border-bottom: 1px solid var(--card-border);
}
.instance-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.instance-name { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
.mini-layer {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  border-bottom: 1px solid rgba(62,111,163,0.07);
}
.mini-layer:last-child { border-bottom: none; }
.mini-id { font-size: 9px; font-weight: 700; color: var(--accent); width: 26px; flex-shrink: 0; letter-spacing: 0.08em; }
.mini-name { font-size: 11px; font-weight: 600; color: var(--text2); }

/* FINAL HEADLINE */
.final-hl {
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
}
.final-hl.show { opacity: 1; transform: none; }
.final-hl h2 {
  font-size: clamp(17px, 2.2vw, 26px);
  font-weight: 300; line-height: 1.25; letter-spacing: -0.02em; color: var(--text);
}
.final-hl h2 strong { font-weight: 700; color: var(--accent); }

/* DOTS */
.nav-area {
  display: flex; align-items: center; justify-content: center;
  padding: 6px 0 11px; flex-shrink: 0;
}
.dots { display: flex; gap: 8px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(62,111,163,0.2);
  transition: all 0.28s; cursor: pointer;
}
.dot.active { background: var(--accent); transform: scale(1.35); }
</style>
</head>
<body>

<div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
<div class="canvas" id="canvas"></div>
<div class="nav-area"><div class="dots" id="dots"></div></div>

<script>
const DURATION = 7000;
const STAGGER  = 75;

const MINI = [
  { id: 'L3', name: 'User Layer' },
  { id: 'L2', name: 'AI & Workflow' },
  { id: 'L1', name: 'Semantic / Domain' },
  { id: 'L0', name: 'Database' },
];

// ── helpers ──────────────────────────────────────────────────────────────────
function layer(id, name, sub, hi, extra) {
  const el = document.createElement('div');
  el.className = 'layer' + (hi ? ' hi' : '');
  el.innerHTML = `<div class="layer-id">${id}</div>
    <div class="layer-content">
      <div class="layer-name">${name}</div>
      ${sub ? `<div class="layer-sub">${sub}</div>` : ''}
    </div>
    ${extra || ''}`;
  return el;
}

function stack(layers) {
  const s = document.createElement('div');
  s.className = 'stack';
  layers.forEach(l => s.appendChild(l));
  return s;
}

function stagger(els, delay = 60, step = STAGGER, animClass = 'fade-up') {
  els.forEach((el, i) => {
    el.style.opacity = '0';
    setTimeout(() => {
      if (animClass) el.classList.add(animClass);
      el.style.opacity = '';
    }, delay + i * step);
  });
}

// ── PHASE 1 — 4 basic layers ──────────────────────────────────────────────────
function phase1() {
  const layers = [
    layer('L3','User Layer',           'UI/UX · Google/Outlook · Claude Integration · Widgets'),
    layer('L2','AI & Workflow Engine', 'AI, Automation, Reporting · Workflow Engine'),
    layer('L1','Semantic Data Layer',  'Datenmodell · Business-Logik · KPI-Definitionen'),
    layer('L0','Database / Data Lake', 'PostgreSQL · Location of data origin'),
  ];
  const s = stack(layers);
  s.style.maxWidth = '700px';
  stagger(layers);
  return s;
}

// ── PHASE 2 — layers expand to reveal sublayers ───────────────────────────────
function phase2() {
  // L3 and L0 stay; L2 → L2b (grows up) + L2a (grows down); L1 → L1b + L1a
  const L3  = layer('L3',  'User Layer',         'UI/UX · Google/Outlook · Claude Integration · Widgets');
  const L2b = layer('L2b', 'Intelligence Layer', 'Claude AI · Reporting · Insights', true);
  const L2a = layer('L2a', 'Workflow Engine',    'Temporal.io · Process Logic · Approvals · Escalations', true);
  const L1b = layer('L1b', 'Semantic Layer',     'KPI-Definitionen · Cube.dev · Business-Metriken · AI-Interface', true);
  const L1a = layer('L1a', 'Domain Model',       'Prisma ORM · Entitäten · Relationen · Customer · Order · GL', true);
  const L0  = layer('L0',  'Database / Data Lake','PostgreSQL · Location of data origin');

  // Animate: L3 and L0 slide in normally; sublayers expand from their parent position
  [L3, L0].forEach((el, i) => {
    el.style.opacity = '0';
    setTimeout(() => { el.classList.add('fade-up'); el.style.opacity = ''; }, 60 + i * (STAGGER * 5));
  });
  // L2b grows up from where L2 was, L2a grows down
  [L2b, L2a].forEach((el, anim, delay) => {}); // handled below
  setTimeout(() => { L2b.classList.add('grow-up'); }, 60 + STAGGER);
  setTimeout(() => { L2a.classList.add('grow-down'); }, 60 + STAGGER * 2);
  setTimeout(() => { L1b.classList.add('grow-up'); }, 60 + STAGGER * 3);
  setTimeout(() => { L1a.classList.add('grow-down'); }, 60 + STAGGER * 4);

  const s = stack([L3, L2b, L2a, L1b, L1a, L0]);
  s.style.maxWidth = '700px';
  return s;
}

// ── PHASE 3 — migration layer ─────────────────────────────────────────────────
function phase3() {
  const wrap = document.createElement('div');
  wrap.className = 'mig-wrap';

  // Left: mini stack, L0 + L1a highlighted
  const stackLayers = [
    layer('L3',  'User Layer',    null, false),
    layer('L2b', 'Intelligence',  null, false),
    layer('L2a', 'Workflow',      null, false),
    layer('L1b', 'Semantic',      null, false),
    layer('L1a', 'Domain Model',  null, true),
    layer('L0',  'Database',      null, true),
  ];
  const stackCol = document.createElement('div');
  stackCol.className = 'mig-stack-col';
  stackLayers.forEach(l => stackCol.appendChild(l));
  stagger(stackLayers, 60, 50, 'fade-up');

  // Arrow col 1 (stack ← migration)
  const a1 = document.createElement('div');
  a1.className = 'arrow-col';
  // Two arrows aligned with L1a and L0
  ['←','←'].forEach((ch, i) => {
    const al = document.createElement('div');
    al.className = 'arrow-line';
    al.textContent = ch;
    a1.appendChild(al);
    setTimeout(() => al.classList.add('show'), 350 + i * 120);
  });

  // Migration block
  const migCol = document.createElement('div');
  migCol.className = 'mig-block-col';
  const mb = document.createElement('div');
  mb.className = 'mig-block';
  mb.style.opacity = '0';
  mb.style.transition = 'opacity 0.45s ease';
  mb.innerHTML = `
    <div class="mig-block-header">Migration Layer</div>
    <div class="mig-block-row">Schema Mapping</div>
    <div class="mig-block-row">Data Transformation</div>
    <div class="mig-block-row">Validation & Dedup</div>
    <div class="mig-block-row">Cutover Tooling</div>
  `;
  migCol.appendChild(mb);
  setTimeout(() => { mb.style.opacity = '1'; }, 150);

  // Arrow col 2 (migration ← sources)
  const a2 = document.createElement('div');
  a2.className = 'arrow-col';
  ['←','←','←','←'].forEach((ch, i) => {
    const al = document.createElement('div');
    al.className = 'arrow-line';
    al.textContent = ch;
    a2.appendChild(al);
    setTimeout(() => al.classList.add('show'), 450 + i * 100);
  });

  // Sources
  const srcCol = document.createElement('div');
  srcCol.className = 'sources-col';
  ['SAP / ERP','CRM','MES','PLM'].forEach((name, i) => {
    const b = document.createElement('div');
    b.className = 'source-box';
    b.textContent = name;
    srcCol.appendChild(b);
    setTimeout(() => b.classList.add('show'), 300 + i * 100);
  });

  wrap.appendChild(stackCol);
  wrap.appendChild(a1);
  wrap.appendChild(migCol);
  wrap.appendChild(a2);
  wrap.appendChild(srcCol);
  return wrap;
}

// ── PHASE 4 + 5 — multi-instance cards ───────────────────────────────────────
function phase4(withHeadline) {
  const companies = ['Company A', 'Company B', 'Company C'];

  const wrap = document.createElement('div');
  wrap.className = 'multi-wrap';

  const lbl = document.createElement('div');
  lbl.className = 'multi-label fade-up';
  lbl.textContent = 'One architecture. Multiple isolated instances.';
  wrap.appendChild(lbl);

  const row = document.createElement('div');
  row.className = 'instances-row';

  companies.forEach((name, i) => {
    const card = document.createElement('div');
    card.className = 'instance-card';

    const header = document.createElement('div');
    header.className = 'instance-header';
    header.innerHTML = `<div class="instance-dot"></div><div class="instance-name">${name}</div>`;
    card.appendChild(header);

    MINI.forEach(l => {
      const ml = document.createElement('div');
      ml.className = 'mini-layer';
      ml.innerHTML = `<div class="mini-id">${l.id}</div><div class="mini-name">${l.name}</div>`;
      card.appendChild(ml);
    });

    row.appendChild(card);
    setTimeout(() => card.classList.add('show'), 100 + i * 120);
  });

  wrap.appendChild(row);

  if (withHeadline) {
    const hl = document.createElement('div');
    hl.className = 'final-hl';
    hl.innerHTML = `<h2>One Platform. Every Company.<br><strong>Live in 90 days. Operated by Capgemini.</strong></h2>`;
    wrap.appendChild(hl);
    setTimeout(() => hl.classList.add('show'), 500);
  }

  return wrap;
}

// ── PHASE TABLE ───────────────────────────────────────────────────────────────
const PHASES = [
  () => phase1(),
  () => phase2(),
  () => phase3(),
  () => phase4(false),
  () => phase4(true),
];

// ── ENGINE ────────────────────────────────────────────────────────────────────
let current = 0;
let timer = null;
const canvas   = document.getElementById('canvas');
const dotsEl   = document.getElementById('dots');
const timerBar = document.getElementById('timer-fill');

PHASES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => { goTo(i); resetTimer(); });
  dotsEl.appendChild(d);
});

function goTo(idx) {
  current = ((idx % PHASES.length) + PHASES.length) % PHASES.length;
  const old = canvas.firstChild;
  if (old) {
    old.style.transition = 'opacity 0.3s ease';
    old.style.opacity = '0';
    setTimeout(() => { if (canvas.contains(old)) canvas.removeChild(old); }, 310);
  }
  const view = PHASES[current]();
  view.style.opacity = '0';
  view.style.transition = 'opacity 0.3s ease';
  canvas.appendChild(view);
  requestAnimationFrame(() => requestAnimationFrame(() => { view.style.opacity = '1'; }));
  dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
}

function startTimer() {
  timerBar.style.transition = 'none';
  timerBar.style.width = '0%';
  void timerBar.offsetWidth;
  timerBar.style.transition = `width ${DURATION}ms linear`;
  timerBar.style.width = '100%';
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => { goTo(current + 1); startTimer(); }, DURATION);
}

function resetTimer() { startTimer(); }

goTo(0);
startTimer();

document.addEventListener('click', e => { if (!e.target.closest('.dot')) { goTo(current + 1); resetTimer(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(current + 1); resetTimer(); }
  if (e.key === 'ArrowLeft') { goTo(current - 1); resetTimer(); }
});
</script>
</body>
</html>
