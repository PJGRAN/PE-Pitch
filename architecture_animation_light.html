<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Architecture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: #14100c;
  user-select: none;
}
:root {
  --a: #3E6FA3;
  --adim: rgba(62,111,163,0.22);
  --ab: rgba(62,111,163,0.13);
  --card: rgba(252,248,244,0.94);
  --muted: rgba(20,16,12,0.5);
  --text2: #2a2016;
  --hi: rgba(232,244,246,0.96);
}
.prog { height: 2px; background: rgba(62,111,163,0.09); flex-shrink: 0; }
.prog-fill { height: 100%; background: var(--a); width: 0; }
.stage { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.view {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 14px 22px 8px; opacity: 0;
}
.phase-lbl {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--a); opacity: 0; white-space: nowrap; pointer-events: none; z-index: 100;
}
.layer {
  display: flex; align-items: stretch;
  border: 1px solid var(--ab); border-radius: 8px;
  background: var(--card); box-shadow: 0 1px 14px rgba(62,111,163,0.09);
  overflow: hidden; width: 100%; flex-shrink: 0;
}
.layer.hi { background: var(--hi); border-color: var(--adim); }
.lid {
  width: 38px; display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--a);
  border-right: 1px solid var(--ab); background: rgba(62,111,163,0.04);
  flex-shrink: 0; padding: 10px 0;
}
.layer.hi .lid { background: rgba(62,111,163,0.08); border-right-color: var(--adim); }
.lbody { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; }
.lname { font-size: 12.5px; font-weight: 600; color: #14100c; line-height: 1.2; }
.layer.hi .lname { color: var(--a); }
.lsub { font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.stack { display: flex; flex-direction: column; gap: 5px; width: 100%; }
.dots-row {
  display: flex; align-items: center; justify-content: center;
  padding: 5px 0 9px; gap: 7px; flex-shrink: 0;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(62,111,163,0.18); cursor: pointer;
  border: none; outline: none;
  transition: background 0.25s, transform 0.25s;
}
.dot.active { background: var(--a); transform: scale(1.45); }
</style>
</head>
<body>
<div class="prog"><div class="prog-fill" id="pbar"></div></div>
<div class="stage" id="stage"><div class="phase-lbl" id="plbl"></div></div>
<div class="dots-row" id="dots"></div>
<script>
const DWELL  = [3800, 4800, 5200, 5800];
const LABELS = ['Platform Architecture', 'Layer Detail', 'Data Integration', 'Multi-Tenancy'];

function h(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function lyr(id, name, sub, hi) {
  const e = h('div', 'layer' + (hi ? ' hi' : ''));
  e.innerHTML = `<div class="lid">${id}</div><div class="lbody"><div class="lname">${name}</div>${sub ? `<div class="lsub">${sub}</div>` : ''}</div>`;
  return e;
}
function stk(arr) {
  const s = h('div', 'stack');
  arr.forEach(x => s.appendChild(x));
  return s;
}

// ── Phase 1: 4 basic layers, build bottom → top ───────────
function p1() {
  const view = h('div', 'view');
  const layers = [
    lyr('L3', 'User Layer',           'Next.js · Google/Outlook · Claude Integration · Widgets'),
    lyr('L2', 'AI & Workflow Engine', 'Claude AI · Temporal.io · Reporting · Automation'),
    lyr('L1', 'Semantic Data Layer',  'Datenmodell · Business-Logik · KPI-Definitionen · Prisma ORM'),
    lyr('L0', 'Database / Data Lake', 'PostgreSQL · Neon Serverless · Location of data origin'),
  ];
  const wrap = h('div'); wrap.style.cssText = 'width:100%;max-width:680px;';
  wrap.appendChild(stk(layers));
  view.appendChild(wrap);
  return {
    view,
    animate() {
      const tl = gsap.timeline();
      tl.from([...layers].reverse(), {
        opacity: 0, y: 22, scale: 0.97,
        duration: 0.55, stagger: 0.1, ease: 'power3.out'
      });
      tl.from(layers.map(l => l.querySelector('.lsub')), {
        opacity: 0, duration: 0.4, stagger: 0.07, ease: 'power2.out'
      }, '-=0.35');
    }
  };
}

// ── Phase 2: sublayers expand ─────────────────────────────
function p2() {
  const view = h('div', 'view');
  const layers = [
    lyr('L3',  'User Layer',         'UI/UX · Google/Outlook · Claude Integration · Widgets'),
    lyr('L2b', 'Intelligence Layer', 'Claude AI · Reporting · Insights · LLM Interface', true),
    lyr('L2a', 'Workflow Engine',    'Temporal.io · Process Logic · Approvals · Escalations', true),
    lyr('L1b', 'Semantic Layer',     'KPI-Definitionen · Cube.dev · Business-Metriken · AI-Interface', true),
    lyr('L1a', 'Domain Model',       'Prisma ORM · Entitäten · Relationen · Customer · Order · GL', true),
    lyr('L0',  'Database / Data Lake','PostgreSQL · Neon Serverless · Location of data origin'),
  ];
  const note = h('div');
  note.style.cssText = 'font-size:10px;color:var(--muted);font-style:italic;text-align:center;margin-top:7px;';
  note.textContent = 'L2a (deterministisch) und L2b (probabilistisch) sind bewusst getrennt';
  const wrap = h('div');
  wrap.style.cssText = 'width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;';
  wrap.appendChild(stk(layers)); wrap.appendChild(note);
  view.appendChild(wrap);
  return {
    view,
    animate() {
      const tl = gsap.timeline();
      tl.from([layers[0], layers[5]], { opacity: 0, y: 16, scale: 0.97, duration: 0.5, stagger: 0.1, ease: 'power3.out' });
      tl.from(layers.slice(1, 3), { opacity: 0, scaleY: 0, transformOrigin: 'top center', duration: 0.4, stagger: 0.1, ease: 'back.out(1.4)' }, '-=0.2');
      tl.from(layers.slice(3, 5), { opacity: 0, scaleY: 0, transformOrigin: 'top center', duration: 0.4, stagger: 0.1, ease: 'back.out(1.4)' }, '-=0.15');
      tl.from(note, { opacity: 0, y: 8, duration: 0.4, ease: 'power2.out' });
    }
  };
}

// ── Phase 3: integration / migration ──────────────────────
function p3() {
  const view = h('div', 'view');
  const outer = h('div');
  outer.style.cssText = 'width:100%;max-width:820px;display:flex;flex-direction:column;align-items:center;gap:8px;';
  const row = h('div'); row.style.cssText = 'display:flex;align-items:center;width:100%;';

  const stackLayers = [
    lyr('L3',  'User Layer',   null),
    lyr('L2b', 'Intelligence', null),
    lyr('L2a', 'Workflow',     null),
    lyr('L1b', 'Semantic',     null),
    lyr('L1a', 'Domain',       null, true),
    lyr('L0',  'Database',     null, true),
  ];
  const stackCol = h('div');
  stackCol.style.cssText = 'flex:0 0 175px;display:flex;flex-direction:column;gap:4px;';
  stackLayers.forEach(l => stackCol.appendChild(l));

  const arrowsL = [], arrowColL = h('div');
  arrowColL.style.cssText = 'flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;';
  ['←','←'].forEach(() => {
    const a = h('div'); a.style.cssText = 'font-size:17px;color:var(--a);font-weight:700;line-height:1;';
    a.textContent = '←'; arrowColL.appendChild(a); arrowsL.push(a);
  });

  const mig = h('div');
  mig.style.cssText = 'flex:0 0 138px;background:rgba(62,111,163,0.07);border:1px solid var(--adim);border-radius:10px;overflow:hidden;box-shadow:0 1px 12px rgba(62,111,163,0.1);';
  mig.innerHTML = `
    <div style="padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--a);border-bottom:1px solid var(--adim);background:rgba(62,111,163,0.06);text-align:center;">Integration Layer</div>
    <div style="padding:5px 11px;font-size:10px;color:var(--muted);border-bottom:1px solid rgba(62,111,163,0.07);">Schema Mapping</div>
    <div style="padding:5px 11px;font-size:10px;color:var(--muted);border-bottom:1px solid rgba(62,111,163,0.07);">Data Transform</div>
    <div style="padding:5px 11px;font-size:10px;color:var(--muted);border-bottom:1px solid rgba(62,111,163,0.07);">Validation</div>
    <div style="padding:5px 11px;font-size:10px;color:var(--muted);">Cutover Tooling</div>`;

  const arrowsR = [], arrowColR = h('div');
  arrowColR.style.cssText = 'flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;';
  [1,2,3,4].forEach(() => {
    const a = h('div'); a.style.cssText = 'font-size:15px;color:var(--a);font-weight:700;line-height:1;';
    a.textContent = '←'; arrowColR.appendChild(a); arrowsR.push(a);
  });

  const sources = [], srcCol = h('div');
  srcCol.style.cssText = 'flex:0 0 120px;display:flex;flex-direction:column;gap:5px;';
  ['SAP / ERP','CRM','MES','PLM'].forEach(name => {
    const b = h('div');
    b.style.cssText = 'background:var(--card);border:1px solid var(--ab);border-radius:7px;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--text2);text-align:center;box-shadow:0 1px 8px rgba(62,111,163,0.07);';
    b.textContent = name; srcCol.appendChild(b); sources.push(b);
  });

  const note = h('div');
  note.style.cssText = 'font-size:10px;color:var(--muted);font-style:italic;text-align:center;width:100%;';
  note.textContent = 'Temporäre Onboarding-Infrastruktur — nach Cutover abschaltbar';

  row.appendChild(stackCol); row.appendChild(arrowColL); row.appendChild(mig);
  row.appendChild(arrowColR); row.appendChild(srcCol);
  outer.appendChild(row); outer.appendChild(note);
  view.appendChild(outer);

  return {
    view,
    animate() {
      const tl = gsap.timeline();
      tl.from(stackLayers, { opacity: 0, x: -14, duration: 0.45, stagger: 0.06, ease: 'power3.out' });
      tl.from(mig, { opacity: 0, x: 28, duration: 0.48, ease: 'power3.out' }, '-=0.2');
      tl.from(arrowsL, { opacity: 0, scaleX: 0, transformOrigin: 'right', duration: 0.32, stagger: 0.1, ease: 'power2.out' }, '-=0.15');
      tl.from(sources, { opacity: 0, x: 22, duration: 0.38, stagger: 0.08, ease: 'power3.out' }, '-=0.15');
      tl.from(arrowsR, { opacity: 0, scaleX: 0, transformOrigin: 'right', duration: 0.28, stagger: 0.06, ease: 'power2.out' }, '-=0.3');
      tl.from(note, { opacity: 0, y: 7, duration: 0.38, ease: 'power2.out' });
    }
  };
}

// ── Phase 4: multi-tenancy split ──────────────────────────
function p4() {
  const view = h('div', 'view');
  view.style.cssText += 'align-items:flex-start;padding-top:16px;';
  const outer = h('div');
  outer.style.cssText = 'width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:7px;';

  const sharedLbl = h('div');
  sharedLbl.style.cssText = 'font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--a);text-align:center;';
  sharedLbl.textContent = 'Shared Application Layer';

  const sharedLayers = [
    lyr('L3',  'User Layer',         null),
    lyr('L2b', 'Intelligence Layer', null),
    lyr('L2a', 'Workflow Engine',    null),
    lyr('L1b', 'Semantic Layer',     null),
  ];
  const sharedStk = h('div');
  sharedStk.style.cssText = 'display:flex;flex-direction:column;gap:4px;width:100%;';
  sharedLayers.forEach(l => sharedStk.appendChild(l));

  const divider = h('div');
  divider.style.cssText = 'width:100%;position:relative;height:16px;display:flex;align-items:center;';
  const dline = h('div');
  dline.style.cssText = 'width:100%;height:1px;background:linear-gradient(to right,transparent,rgba(62,111,163,0.22) 20%,rgba(62,111,163,0.22) 80%,transparent);';
  const dlbl = h('div');
  dlbl.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);background:rgba(248,244,240,0.98);padding:0 10px;font-size:8.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;';
  dlbl.textContent = 'deployment boundary';
  divider.appendChild(dline); divider.appendChild(dlbl);

  const tenantsRow = h('div');
  tenantsRow.style.cssText = 'display:flex;gap:10px;width:100%;';

  const std = h('div');
  std.style.cssText = 'flex:1;border:2px solid #2B6E4A;border-radius:12px;overflow:hidden;background:rgba(240,250,244,0.94);box-shadow:0 2px 18px rgba(43,110,74,0.12);';
  std.innerHTML = `
    <div style="padding:8px 13px;background:rgba(43,110,74,0.08);border-bottom:1px solid rgba(43,110,74,0.14);display:flex;align-items:center;gap:6px;">
      <div style="width:7px;height:7px;border-radius:50%;background:#2B6E4A;"></div>
      <div style="font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#2B6E4A;">Standard Multi-Tenant</div>
    </div>
    <div style="padding:8px 13px;display:flex;flex-direction:column;gap:5px;">
      <div style="display:flex;gap:7px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(43,110,74,0.08);">
        <span style="font-size:9px;font-weight:700;color:#2B6E4A;width:26px;flex-shrink:0;">L1a</span>
        <span style="font-size:11px;font-weight:600;color:var(--text2);">Domain Model</span>
        <span style="font-size:9px;color:var(--muted);margin-left:auto;">Shared Schema</span>
      </div>
      <div style="display:flex;gap:7px;align-items:center;padding:3px 0;">
        <span style="font-size:9px;font-weight:700;color:#2B6E4A;width:26px;flex-shrink:0;">L0</span>
        <span style="font-size:11px;font-weight:600;color:var(--text2);">PostgreSQL</span>
        <span style="font-size:9px;color:var(--muted);margin-left:auto;">Vercel / Railway</span>
      </div>
      <div style="margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
        ${['A','B','C','D'].map(t=>`<div style="width:20px;height:20px;border-radius:50%;background:rgba(43,110,74,0.14);border:1px solid rgba(43,110,74,0.28);display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:#2B6E4A;">${t}</div>`).join('')}
        <span style="font-size:9px;color:var(--muted);">tenantId RLS</span>
      </div>
    </div>`;

  const mil = h('div');
  mil.style.cssText = 'flex:1;border:2px solid #8B4A2A;border-radius:12px;overflow:hidden;background:rgba(253,244,240,0.94);box-shadow:0 2px 18px rgba(139,74,42,0.12);';
  mil.innerHTML = `
    <div style="padding:8px 13px;background:rgba(139,74,42,0.08);border-bottom:1px solid rgba(139,74,42,0.14);display:flex;align-items:center;gap:6px;">
      <div style="width:7px;height:7px;border-radius:50%;background:#8B4A2A;"></div>
      <div style="font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8B4A2A;">Military / CMMC L2</div>
    </div>
    <div style="padding:8px 13px;display:flex;flex-direction:column;gap:5px;">
      <div style="display:flex;gap:7px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(139,74,42,0.08);">
        <span style="font-size:9px;font-weight:700;color:#8B4A2A;width:26px;flex-shrink:0;">L1a</span>
        <span style="font-size:11px;font-weight:600;color:var(--text2);">Domain Model</span>
        <span style="font-size:9px;color:var(--muted);margin-left:auto;">Isolated Schema</span>
      </div>
      <div style="display:flex;gap:7px;align-items:center;padding:3px 0;">
        <span style="font-size:9px;font-weight:700;color:#8B4A2A;width:26px;flex-shrink:0;">L0</span>
        <span style="font-size:11px;font-weight:600;color:var(--text2);">PostgreSQL Encrypted</span>
        <span style="font-size:9px;color:var(--muted);margin-left:auto;">AWS GovCloud</span>
      </div>
      <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap;">
        ${['FIPS 140-2','FedRAMP','CMMC L2','Isolated VPC'].map(t=>`<span style="background:rgba(139,74,42,0.09);border:1px solid rgba(139,74,42,0.18);border-radius:3px;padding:2px 5px;font-size:8.5px;font-weight:600;color:#8B4A2A;">${t}</span>`).join('')}
      </div>
      <div style="font-size:9px;color:var(--muted);">Azure OpenAI Gov · Immutable Audit Log</div>
    </div>`;

  tenantsRow.appendChild(std); tenantsRow.appendChild(mil);
  outer.appendChild(sharedLbl); outer.appendChild(sharedStk);
  outer.appendChild(divider); outer.appendChild(tenantsRow);
  view.appendChild(outer);

  return {
    view,
    animate() {
      const tl = gsap.timeline();
      tl.from(sharedLbl, { opacity: 0, y: -10, duration: 0.38, ease: 'power2.out' });
      tl.from(sharedLayers, { opacity: 0, y: 14, scale: 0.97, duration: 0.45, stagger: 0.08, ease: 'power3.out' }, '-=0.15');
      tl.from(divider, { scaleX: 0, duration: 0.55, ease: 'power2.inOut', transformOrigin: 'center' }, '-=0.1');
      tl.from(std, { opacity: 0, x: -28, scale: 0.97, duration: 0.52, ease: 'power3.out' }, '-=0.2');
      tl.from(mil, { opacity: 0, x: 28, scale: 0.97, duration: 0.52, ease: 'power3.out' }, '<');
    }
  };
}

// ── engine ────────────────────────────────────────────────
const PHASES = [p1, p2, p3, p4];
let cur = 0, advTimer = null, activeView = null;
const stage  = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const pbar   = document.getElementById('pbar');
const plbl   = document.getElementById('plbl');

PHASES.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
  dotsEl.appendChild(d);
});

function goTo(idx) {
  idx = ((idx % PHASES.length) + PHASES.length) % PHASES.length;
  if (advTimer) clearTimeout(advTimer);
  gsap.killTweensOf(pbar);
  gsap.killTweensOf(plbl);

  const { view, animate } = PHASES[idx]();
  gsap.set(view, { opacity: 0 });
  stage.appendChild(view);

  if (activeView) {
    const old = activeView;
    gsap.to(old, { opacity: 0, duration: 0.38, ease: 'power2.in',
      onComplete: () => { if (stage.contains(old)) stage.removeChild(old); }
    });
  }

  gsap.to(view, { opacity: 1, duration: 0.38, ease: 'power2.out' });
  gsap.delayedCall(0.2, () => animate());

  activeView = view;
  cur = idx;
  dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));

  gsap.fromTo(pbar, { width: '0%' }, { width: '100%', duration: DWELL[cur] / 1000, ease: 'none' });

  plbl.textContent = LABELS[cur];
  gsap.fromTo(plbl,
    { opacity: 0, y: -5 },
    { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out',
      onComplete: () => gsap.to(plbl, { opacity: 0, delay: 1.8, duration: 0.5, ease: 'power2.in' })
    }
  );

  advTimer = setTimeout(() => goTo(cur + 1), DWELL[cur]);
}

stage.addEventListener('click', () => goTo(cur + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(cur + 1); }
  if (e.key === 'ArrowLeft') goTo(cur - 1);
});

goTo(0);
</script>
</body>
</html>
